name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CLOUD_RUN_SERVICE: mlops-group113
  CLOUD_RUN_REGION: asia-south1
  GCP_PROJECT_ID: mtech-mlops-2024

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: Run preprocessing tests
        run: |
          pytest tests/test_preprocessing.py -v --tb=short

      - name: Run inference tests
        run: |
          pytest tests/test_inference.py -v --tb=short

      - name: Generate coverage report
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=term

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --source . \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Get Cloud Run URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format='value(status.url)' \
            --project ${{ env.GCP_PROJECT_ID }})
          echo "Cloud Run URL: $SERVICE_URL"
          echo "CLOUD_RUN_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Smoke test - Health check
        run: |
          sleep 5
          curl -f ${{ env.CLOUD_RUN_URL }}/health || exit 1

      - name: Smoke test - Predict endpoint
        run: |
          curl -f ${{ env.CLOUD_RUN_URL }}/docs || true

      - name: Deployment successful
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Service deployed to: ${{ env.CLOUD_RUN_URL }}"
